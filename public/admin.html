<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFome - Gerenciar Restaurantes e Pratos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">i<span>Fome</span></a>
        <nav id="menu-navegacao">
            <a href="index.html">Início</a>
            <a href="admin.html" class="ativo">Gerenciar (CRUD)</a>
            <a href="login.html" id="link-usuario">Entrar / Cadastrar</a>
        </nav>
    </header>

    <main class="container conteudo">
        <div id="mensagem-admin" class="alerta oculto"></div>

        <!-- crud restaurantes -->
        <section class="secao">
            <div class="secao-titulo">
                <h2>Cadastro de Restaurantes</h2>
            </div>

            <form class="formulario" id="form-restaurante" style="max-width: 100%; margin-top: 0;">
                <input type="hidden" id="rest-id">
                <div class="form-linha">
                    <div class="campo">
                        <label for="rest-nome">Nome do Restaurante *</label>
                        <input type="text" id="rest-nome" placeholder="Ex: Burger Kingo" required>
                    </div>
                    <div class="campo">
                        <label for="rest-categoria">Categoria *</label>
                        <select id="rest-categoria" required>
                            <option value="Lanches">Lanches</option>
                            <option value="Pizza">Pizza</option>
                            <option value="Brasileira">Brasileira</option>
                            <option value="Japonesa">Japonesa</option>
                            <option value="Doces">Doces</option>
                        </select>
                    </div>
                </div>

                <div class="form-linha">
                    <div class="campo">
                        <label for="rest-tempo">Tempo de Entrega</label>
                        <input type="text" id="rest-tempo" placeholder="Ex: 30-45 min" value="30-45 min">
                    </div>
                    <div class="campo">
                        <label for="rest-taxa">Taxa de Entrega (R$)</label>
                        <input type="number" step="0.01" id="rest-taxa" placeholder="0.00" value="5.00">
                    </div>
                </div>

                <div class="campo">
                    <label for="rest-imagem">URL da Imagem (opcional)</label>
                    <input type="url" id="rest-imagem" placeholder="https://...">
                </div>

                <div class="campo">
                    <label for="rest-descricao">Descrição curta</label>
                    <input type="text" id="rest-descricao" placeholder="Ex: Os melhores hambúrgueres artesanais">
                </div>

                <div class="flex gap-10">
                    <button type="submit" class="btn btn-vermelho" id="btn-salvar-restaurante">Salvar Restaurante</button>
                    <button type="button" class="btn btn-cinza oculto" id="btn-cancelar-restaurante">Cancelar Edição</button>
                </div>
            </form>

            <div class="secao-titulo mt-20">
                <h3>Restaurantes Cadastrados</h3>
            </div>
            <div class="lista-restaurantes" id="admin-lista-restaurantes"></div>
        </section>

        <hr style="border: 0; border-top: 1px solid #ddd; margin: 40px 0;">

        <!-- crud pratos -->
        <section class="secao">
            <div class="secao-titulo">
                <h2>Cadastro de Pratos (Cardápio)</h2>
            </div>

            <form class="formulario" id="form-prato" style="max-width: 100%; margin-top: 0;">
                <input type="hidden" id="prato-id">
                <div class="form-linha">
                    <div class="campo">
                        <label for="prato-restaurante">Restaurante *</label>
                        <select id="prato-restaurante" required>
                            <option value="">Selecione um restaurante...</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="prato-nome">Nome do Prato *</label>
                        <input type="text" id="prato-nome" placeholder="Ex: X-Bacon Duplo" required>
                    </div>
                </div>

                <div class="form-linha">
                    <div class="campo">
                        <label for="prato-preco">Preço (R$) *</label>
                        <input type="number" step="0.01" id="prato-preco" placeholder="Ex: 29.90" required>
                    </div>
                    <div class="campo">
                        <label for="prato-imagem">URL da Imagem (opcional)</label>
                        <input type="url" id="prato-imagem" placeholder="https://...">
                    </div>
                </div>

                <div class="campo">
                    <label for="prato-descricao">Descrição do Prato</label>
                    <input type="text" id="prato-descricao" placeholder="Ingredientes e detalhes do prato">
                </div>

                <div class="flex gap-10">
                    <button type="submit" class="btn btn-vermelho" id="btn-salvar-prato">Salvar Prato</button>
                    <button type="button" class="btn btn-cinza oculto" id="btn-cancelar-prato">Cancelar Edição</button>
                </div>
            </form>

            <div class="secao-titulo mt-20">
                <h3>Pratos Cadastrados</h3>
            </div>
            <div class="lista-pratos" id="admin-lista-pratos"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
